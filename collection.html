    <div class="sort">

    <div class="filters__len" data-lens hidden>

      <div class="chip-row" role="group" aria-label="식탁 길이">
        <button type="button" class="chip chip--soft" aria-pressed="true" data-len="0">전체</button>
        <button type="button" class="chip chip--soft" aria-pressed="false" data-len="1600">1600</button>
        <button type="button" class="chip chip--soft" aria-pressed="false" data-len="1700">1700</button>
        <button type="button" class="chip chip--soft" aria-pressed="false" data-len="1800">1800</button>
        <button type="button" class="chip chip--soft" aria-pressed="false" data-len="1900">1900</button>

    </div>
